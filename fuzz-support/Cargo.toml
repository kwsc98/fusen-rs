[package]
name = "fusen-fuzz-support"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[dependencies]
bytes = "1.12.1"
fusen-contract = { path = "../fusen-contract", version = "0.9.0" }
http = "1.4.2"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["http1", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util", "time"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = ["v4"] }
