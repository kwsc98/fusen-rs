[package]
name = "examples"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
publish = false


[[bin]]
name = "host-server"
path = "src/host/server.rs"

[[bin]]
name = "host-client"
path = "src/host/client.rs"

[[bin]]
name = "host-client-pt"
path = "src/host/client_pt.rs"

[[bin]]
name = "host-server-pt"
path = "src/host/server_pt.rs"

[[bin]]
name = "nacos-server"
path = "src/nacos/server.rs"

[[bin]]
name = "nacos-client"
path = "src/nacos/client.rs"

[[bin]]
name = "nacos-hot-config"
path = "src/nacos/hot_config.rs"


[dependencies]
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
serde.workspace = true
serde_json.workspace = true

fusen-rs.workspace = true
fusen-common = { workspace = true, features = ["nacos", "otel", "yaml"] }
rand = "0.9.2"
tracing = "0.1.41"
tracing-opentelemetry = "0.32.0"
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = [
    "rt-tokio",
    "rt-tokio-current-thread",
    "experimental_trace_batch_span_processor_with_async_runtime",
] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic"] }
