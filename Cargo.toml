[workspace]
members = [
    "fusen-config",
    "fusen-nacos",
    "fusen-observability",
    "fusen-contract",
    "fusen-macro/procedural-macro",
    "fusen-macro/tests/renamed-runtime",
    "fusen-register",
    "fusen",
    "examples",
]
resolver = "3"

[workspace.package]
authors = ["kwsc98 <kwsc98@gmail.com>"]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Reliable JSON RPC framework with generated clients, middleware, and service discovery"
repository = "https://github.com/kwsc98/fusen-rs"
homepage = "https://github.com/kwsc98/fusen-rs"
documentation = "https://docs.rs/fusen-rs"
readme = "README.md"
license-file = "LICENSE"

[workspace.dependencies]
fusen-config = { path = "fusen-config", version = "0.9.0" }
fusen-nacos = { path = "fusen-nacos", version = "0.9.0" }
fusen-observability = { path = "fusen-observability", version = "0.9.0" }
fusen-contract = { path = "fusen-contract", version = "0.9.0" }
fusen-procedural-macro = { path = "fusen-macro/procedural-macro", version = "0.9.0" }
fusen-register = { path = "fusen-register", version = "0.9.0" }
fusen-rs = { path = "fusen", version = "0.9.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = "1.53.1"
tokio-util = "0.7.19"
futures-util = "0.3.33"
thiserror = "2.0.19"
tracing = "0.1.44"
chrono = "0.4.45"
nacos-sdk = "0.8.0"
serde_yaml_ng = "0.10.0"
toml = "1.1.3"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "local-time"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
url = "2.5.8"
mime = "0.3.17"
percent-encoding = "2.3.2"
uuid = "1.24.0"
http = "1.4.2"
httpdate = "1.0.3"
bytes = "1.12.1"
http-body-util = "0.1.4"
hyper = "1.11.0"
hyper-util = "0.1.20"
tower-service = "0.3.3"
hyper-rustls = { version = "0.27.9", default-features = false, features = [
    "http1",
    "http2",
    "ring",
    "tls12",
    "webpki-tokio",
] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13.2", default-features = false, features = ["ring"] }
rand = "0.10.2"
urlencoding = "2.1.3"
quote = "1.0.47"
syn = "3.0.3"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
trybuild = "1.0.118"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
panic = "unwind"
