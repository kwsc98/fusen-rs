[workspace]
members = [
    "fusen-common",
    "fusen-common/derive-macro",
    "fusen-common/procedural-macro",
    "fusen-internal-common",
    "fusen-macro/derive-macro",
    "fusen-macro/procedural-macro",
    "fusen-register",
    "fusen",
    "examples",
]
resolver = "2"

[workspace.package]
authors = ["kwsc98 <kwsc98@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Reliable JSON RPC framework with generated clients, middleware, and service discovery"

[workspace.dependencies]
fusen-common = { path = "fusen-common", version = "0.9.0" }
fusen-common-derive-macro = { path = "fusen-common/derive-macro", version = "0.9.0" }
fusen-common-procedural-macro = { path = "fusen-common/procedural-macro", version = "0.9.0" }
fusen-internal-common = { path = "fusen-internal-common", version = "0.9.0" }
fusen-derive-macro = { path = "fusen-macro/derive-macro", version = "0.9.0" }
fusen-procedural-macro = { path = "fusen-macro/procedural-macro", version = "0.9.0" }
fusen-register = { path = "fusen-register", version = "0.9.0" }
fusen-rs = { path = "fusen", version = "0.9.0" }

serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
thiserror = "2.0.16"
tracing = "0.1.41"
chrono = "0.4.42"
nacos-sdk = "0.5.2"
serde_yaml = "0.9.34-deprecated"
toml = "0.9.7"
tracing-subscriber = { version = "0.3.20", features = ["json", "env-filter", "local-time"] }
tracing-appender = "0.2.3"
tracing-opentelemetry = "0.32.0"
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "rt-tokio-current-thread", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic"] }
url = "2.5.4"
