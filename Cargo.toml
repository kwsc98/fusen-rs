[workspace]
members = [
    "fusen-config",
    "fusen-config/procedural-macro",
    "fusen-nacos",
    "fusen-observability",
    "fusen-contract",
    "fusen-macro/support",
    "fusen-macro/procedural-macro",
    "fusen-macro/tests/renamed-runtime",
    "fusen-register",
    "fusen",
    "examples",
]
resolver = "2"

[workspace.package]
authors = ["kwsc98 <kwsc98@gmail.com>"]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Reliable JSON RPC framework with generated clients, middleware, and service discovery"
repository = "https://github.com/kwsc98/fusen-rs"
homepage = "https://github.com/kwsc98/fusen-rs"
documentation = "https://docs.rs/fusen-rs"
readme = "README.md"
license-file = "LICENSE"

[workspace.dependencies]
fusen-config = { path = "fusen-config", version = "0.9.0" }
fusen-config-macro = { path = "fusen-config/procedural-macro", version = "0.9.0" }
fusen-nacos = { path = "fusen-nacos", version = "0.9.0" }
fusen-observability = { path = "fusen-observability", version = "0.9.0" }
fusen-contract = { path = "fusen-contract", version = "0.9.0" }
fusen-macro-support = { path = "fusen-macro/support", version = "0.9.0" }
fusen-procedural-macro = { path = "fusen-macro/procedural-macro", version = "0.9.0" }
fusen-register = { path = "fusen-register", version = "0.9.0" }
fusen-rs = { path = "fusen", version = "0.9.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = "1.53.1"
thiserror = "2.0.19"
tracing = "0.1.44"
chrono = "0.4.45"
nacos-sdk = "0.8.0"
serde_yaml_ng = "0.10.0"
toml = "1.1.3"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "local-time"] }
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "rt-tokio-current-thread", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
url = "2.5.8"
mime = "0.3.17"
percent-encoding = "2.3.2"
uuid = "1.24.0"
http = "1.4.2"
bytes = "1.12.1"
http-body-util = "0.1.4"
hyper = "1.11.0"
hyper-tls = "0.6.0"
hyper-util = "0.1.20"
rand = "0.10.2"
urlencoding = "2.1.3"
quote = "1.0.47"
syn = "3.0.3"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
trybuild = "1.0.118"
