[package]
name = "fusen-common"
version = "0.9.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fusen-common"
readme.workspace = true
license-file.workspace = true

[features]
default = ["config", "logging", "async-utils"]
async-utils = ["dep:tokio"]
config = ["dep:tokio", "dep:toml", "dep:tracing"]
logging = [
    "dep:chrono",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
]
yaml = ["config", "dep:serde_yaml_ng"]
nacos = [
    "config",
    "dep:fusen-register",
    "dep:nacos-sdk",
    "dep:percent-encoding",
    "dep:url",
]
otel = [
    "logging",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

[dependencies]
fusen-common-procedural-macro.workspace = true
fusen-common-derive-macro.workspace = true
fusen-register = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }
chrono = { workspace = true, optional = true }
serde.workspace = true
serde_yaml_ng = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
nacos-sdk = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
http = "1.3.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
