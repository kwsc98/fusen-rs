[package]
name = "fusen-rs"
version = "0.9.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fusen-rs"
readme.workspace = true
license-file.workspace = true


[dependencies]
fusen-procedural-macro.workspace = true
fusen-contract.workspace = true
fusen-register.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "io-util",
] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

#网络协议处理
http.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1", "http2"] }
hyper-tls = { workspace = true, features = ["alpn"] }
hyper-util = { workspace = true, features = ["client-legacy", "server-auto", "tokio"] }
rand.workspace = true
urlencoding.workspace = true
url.workspace = true
mime.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[[bench]]
name = "invocation"
harness = false
