[package]
name = "fusen-rs"
version = "0.9.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fusen-rs"
readme.workspace = true
license-file.workspace = true


[dependencies]
fusen-procedural-macro.workspace = true
fusen-internal-common = { workspace = true, features = ["serde-json", "uuid"] }
fusen-register.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "io-util",
] }
tracing.workspace = true

#网络协议处理
http = "1.3.1"
bytes = "1.10.1"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "server", "http1", "http2"] }
hyper-tls = { version = "0.6.0", features = ["alpn"] }
hyper-util = { version = "0.1.17", features = ["client-legacy", "server-auto", "tokio"] }
rand = "0.9.2"
urlencoding = "2.1.3"
url.workspace = true
mime.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
