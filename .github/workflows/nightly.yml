name: Nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: fuzz-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wire_codec, spring_path, problem_details]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Fuzz the private-source harness
        working-directory: fuzz
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time=300
          -timeout=10
          -max_len=65536
          -rss_limit_mb=4096
      - name: Upload crashing and timeout inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  core-e2e-repeat:
    name: core-e2e-repeat-100
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.97.0 fetch --locked
      - name: Repeat real HTTP/1.1 and h2c E2E tests 100 times
        env:
          CORE_E2E_REPEAT_COUNT: 100
        run: bash .github/scripts/repeat-core-e2e-tests.sh
