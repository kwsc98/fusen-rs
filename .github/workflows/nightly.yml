name: Nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: fuzz-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wire_codec, http_binding, problem_details]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Fuzz the private-source harness
        id: fuzz_run
        working-directory: fuzz
        shell: bash
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          set -uo pipefail

          log_dir="$GITHUB_WORKSPACE/target/nightly-fuzz-logs"
          log_file="$log_dir/$FUZZ_TARGET.log"
          status_file="$log_dir/$FUZZ_TARGET.status"
          mkdir -p "$log_dir"

          # Prebuilt cargo-fuzz binaries can default to their musl build triple.
          # ASan must instead target the runner's dynamically linked host.
          fuzz_host="$(rustc +nightly -vV | sed -n 's/^host: //p')"
          if [[ -z "$fuzz_host" ]]; then
            printf 'could not determine the nightly rustc host target\n' >&2
            exit 1
          fi

          fuzz_command=(
            cargo +nightly fuzz run --target "$fuzz_host" "$FUZZ_TARGET" --
            -max_total_time=300
            -timeout=10
            -max_len=65536
            -rss_limit_mb=4096
          )

          {
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'runner=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            cargo +nightly --version
            rustc +nightly --version --verbose
            cargo +nightly fuzz --version
            printf 'command:'
            printf ' %q' "${fuzz_command[@]}"
            printf '\n'
          } 2>&1 | tee "$log_file"

          set +e
          "${fuzz_command[@]}" 2>&1 | tee -a "$log_file"
          fuzz_exit_status=${PIPESTATUS[0]}
          set -e

          printf 'exit_status=%s\n' "$fuzz_exit_status" > "$status_file"
          printf 'exit_status=%s\n' "$fuzz_exit_status" | tee -a "$log_file"
          exit "$fuzz_exit_status"
      - name: Upload fuzz failure diagnostics
        if: failure() && steps.fuzz_run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: >-
            fuzz-diagnostics-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/nightly-fuzz-logs/${{ matrix.target }}.log
            target/nightly-fuzz-logs/${{ matrix.target }}.status
          if-no-files-found: error
          retention-days: 14
      - name: Upload crashing and timeout inputs
        if: failure() && steps.fuzz_run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: >-
            fuzz-artifacts-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

  core-e2e-repeat:
    name: core-e2e-repeat-100
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.97.0 fetch --locked
      - name: Repeat real HTTP/1.1 and h2c E2E tests 100 times
        env:
          CORE_E2E_REPEAT_COUNT: 100
        run: bash .github/scripts/repeat-core-e2e-tests.sh
