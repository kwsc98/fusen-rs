name: Release Benchmark Gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Compare with the committed baseline or generate its five-run replacement
        required: true
        default: compare
        type: choice
        options:
          - compare
          - calibrate

permissions:
  contents: read

concurrency:
  group: release-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invocation-regression:
    name: release-benchmark-${{ inputs.mode }}
    runs-on: [self-hosted, fusen-benchmark-0-9-reference]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the fixed v0.9.0 evidence ref
        shell: bash
        env:
          BENCHMARK_MODE: ${{ inputs.mode }}
        run: |
          case "$BENCHMARK_MODE" in
            calibrate) expected_ref="refs/heads/release/v0.9.0-calibration" ;;
            compare) expected_ref="refs/heads/release/v0.9.0-rc" ;;
            *) echo "unsupported benchmark mode: $BENCHMARK_MODE" >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = "$expected_ref" || {
            echo "$BENCHMARK_MODE must run from $expected_ref, got $GITHUB_REF" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo +1.97.0 fetch --locked
      - name: Run five same-host samples and enforce baseline-only provenance
        if: inputs.mode == 'compare'
        run: >-
          python3 .github/scripts/run-benchmark-gate.py
          --host-id fusen-0.9-reference-macos-arm64
          --runs 5
          --baseline .github/benchmarks/fusen-0.9-reference-macos-arm64.json
          --output-dir
          target/release-benchmark-gate/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Generate a five-run baseline candidate from this clean SHA
        if: inputs.mode == 'calibrate'
        run: >-
          python3 .github/scripts/run-benchmark-gate.py
          --host-id fusen-0.9-reference-macos-arm64
          --runs 5
          --write-baseline
          target/release-benchmark-gate/${{ github.run_id }}-${{ github.run_attempt }}/fusen-0.9-reference-macos-arm64.json
          --output-dir
          target/release-benchmark-gate/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive raw samples and comparison summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-benchmark-${{ inputs.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/release-benchmark-gate/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
